<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Jins Gaming Pro</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;600&display=swap" rel="stylesheet">

<style>
*{margin:0;padding:0;box-sizing:border-box;}

body{
    font-family:'Poppins',sans-serif;
    background:radial-gradient(circle,#0a0a0a,#000);
    color:white;
}

/* 🔥 TOP BAR */
.topbar{
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding:15px;
    background:#000;
}
.menu-btn{
    font-size:25px;
    cursor:pointer;
}

/* 🔥 SIDEBAR (hidden) */
nav{
    position:fixed;
    left:-220px;
    top:0;
    width:200px;
    height:100vh;
    background:#000;
    padding:20px;
    display:flex;
    flex-direction:column;
    transition:0.3s;
}
nav.active{
    left:0;
}

nav h2{
    color:#00ffff;
    margin-bottom:30px;
}
nav a{
    color:white;
    text-decoration:none;
    margin:10px 0;
    font-size:18px;
}
nav a:hover{
    color:#00ffff;
}

/* HERO */
.hero{
    height:90vh;
    display:flex;
    flex-direction:column;
    justify-content:center;
    align-items:center;
    text-align:center;
}
.hero h1{
    font-size:40px;
    color:#00ffff;
}
.hero button{
    margin-top:20px;
    padding:12px 25px;
    background:red;
    border:none;
    color:white;
    cursor:pointer;
}

/* SLIDER */
.slider{
    position:relative;
    overflow:hidden;
}
.slides{
    display:flex;
    transition:0.5s;
}
.slides img{
    width:100%;
    height:250px;
    object-fit:cover;
}

.prev,.next{
    position:absolute;
    top:50%;
    transform:translateY(-50%);
    background:rgba(0,0,0,0.6);
    color:white;
    border:none;
    padding:10px;
    cursor:pointer;
}
.prev{left:10px;}
.next{right:10px;}

/* SECTION */
.section{
    padding:40px;
    text-align:center;
}

/* CARD */
.cards{
    display:flex;
    flex-wrap:wrap;
    justify-content:center;
}
.card{
    background:#111;
    margin:10px;
    padding:20px;
    width:200px;
    border-radius:10px;
}

/* VIDEO */
iframe{
    margin:10px;
    border-radius:10px;
}
</style>
</head>

<body>

<!-- 🔥 TOP BAR -->
<div class="topbar">
    <span class="menu-btn" id="menuBtn" onclick="toggleMenu()">☰</span>
    <h2 style="color:#00ffff;">🎮 Jins Gaming</h2>
</div>

<!-- 🔥 SIDEBAR -->
<nav id="menu">
    <h2>🎮 Menu</h2>
    <a href="#">🏠 Home</a>
    <a href="#videos">🎥 Videos</a>
    <a href="#about">👑 About</a>
</nav>

<!-- HERO -->
<section class="hero">
    <h1>🔥 Jins Gaming Pro 🔥</h1>
    <p>Gameplay | Funny | Live 🔴</p>
    <button onclick="window.open('https://youtube.com')">Subscribe</button>
</section>

<!-- SLIDER -->
<section class="slider">
    <div class="slides" id="slide">
        <img src="https://picsum.photos/800/250?1">
        <img src="https://picsum.photos/800/250?2">
        <img src="https://picsum.photos/800/250?3">
    </div>
    <button class="prev" onclick="prevSlide()">❮</button>
    <button class="next" onclick="nextSlide()">❯</button>
</section>

<!-- CONTENT -->
<section class="section">
    <h2>⚡ Game Content</h2>
    <div class="cards">
        <div class="card">🎯 BGMI Tips</div>
        <div class="card">😂 Funny Moments</div>
        <div class="card">🔥 Gameplay</div>
    </div>
</section>

<!-- VIDEOS -->
<section class="section" id="videos">
    <h2>🎥 Videos</h2>
    <iframe width="300" height="170"
    src="https://www.youtube.com/embed/dQw4w9WgXcQ"></iframe>
</section>

<!-- ABOUT -->
<section class="section" id="about">
    <h2>👑 About</h2>
    <p>Jins Gaming 🔥</p>
</section>

<!-- JS -->
<script>
/* MENU TOGGLE + ICON CHANGE */
function toggleMenu(){
    const menu = document.getElementById("menu");
    const btn = document.getElementById("menuBtn");

    menu.classList.toggle("active");

    if(menu.classList.contains("active")){
        btn.innerHTML = "✖";
    } else {
        btn.innerHTML = "☰";
    }
}

/* CLOSE MENU WHEN CLICK LINK */
const links = document.querySelectorAll("nav a");
links.forEach(link=>{
    link.addEventListener("click", ()=>{
        document.getElementById("menu").classList.remove("active");
        document.getElementById("menuBtn").innerHTML = "☰";
    });
});

/* SLIDER */
let index=0;
const total=3;

function showSlide(){
    document.getElementById("slide").style.transform =
    "translateX("+(-index*100)+"%)";
}

function nextSlide(){
    index=(index+1)%total;
    showSlide();
}

function prevSlide(){
    index=(index-1+total)%total;
    showSlide();
}
</script>

</body>
</html>
