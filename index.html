<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Jins Gaming Pro</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;600&display=swap" rel="stylesheet">

<style>
*{margin:0;padding:0;box-sizing:border-box;}
body{
    font-family:'Poppins',sans-serif;
    background:#0a0a0a;
    color:white;
}

/* NAVBAR */
nav{
    display:flex;
    justify-content:space-between;
    padding:15px 40px;
    background:#000;
    position:sticky;
    top:0;
}
nav h2{color:#00ffff;}
nav a{
    color:white;
    margin-left:20px;
    text-decoration:none;
}

/* HERO */
.hero{
    height:90vh;
    display:flex;
    flex-direction:column;
    justify-content:center;
    align-items:center;
    text-align:center;
    background:linear-gradient(45deg,#000,#111);
}
.hero h1{
    font-size:50px;
    color:#00ffff;
}
.hero button{
    margin-top:20px;
    padding:12px 25px;
    background:red;
    border:none;
    color:white;
    cursor:pointer;
}

/* 🔥 SLIDER */
.slider{
    position:relative;
    max-width:100%;
    overflow:hidden;
}
.slides{
    display:flex;
    transition:0.5s;
}
.slides img{
    width:100%;
    height:300px;
    object-fit:cover;
}

/* buttons */
.prev, .next{
    position:absolute;
    top:50%;
    transform:translateY(-50%);
    background:rgba(0,0,0,0.6);
    color:white;
    border:none;
    padding:10px;
    cursor:pointer;
}
.prev{left:10px;}
.next{right:10px;}

/* SECTION */
.section{
    padding:50px;
    text-align:center;
}
.cards{
    display:flex;
    flex-wrap:wrap;
    justify-content:center;
}
.card{
    background:#111;
    margin:15px;
    padding:20px;
    width:250px;
    border-radius:10px;
    transition:0.3s;
}
.card:hover{
    transform:scale(1.05);
}

/* VIDEOS */
iframe{
    border:none;
    border-radius:10px;
    margin:10px;
}

/* FOOTER */
footer{
    padding:20px;
    text-align:center;
    background:#000;
}
</style>
</head>

<body>

<nav>
    <h2>🎮 Jins Gaming</h2>
    <div>
        <a href="#">Home</a>
        <a href="#videos">Videos</a>
        <a href="#about">About</a>
    </div>
</nav>

<section class="hero">
    <h1>🔥 Jins Gaming Pro 🔥</h1>
    <p>Gameplay | Funny | Live 🔴</p>
    <button onclick="window.open('https://youtube.com')">Subscribe</button>
</section>

<!-- 🔥 IMAGE SLIDER -->
<section class="slider">
    <div class="slides" id="slide">
        <img src="https://picsum.photos/1200/300?1">
        <img src="https://picsum.photos/1200/300?2">
        <img src="https://picsum.photos/1200/300?3">
    </div>
    <button class="prev" onclick="prevSlide()">❮</button>
    <button class="next" onclick="nextSlide()">❯</button>
</section>

<section class="section">
    <h2>⚡ Game Content</h2>
    <div class="cards">
        <div class="card">🎯 BGMI Tips</div>
        <div class="card">😂 Funny Moments</div>
        <div class="card">🔥 Pro Gameplay</div>
    </div>
</section>

<section class="section" id="videos">
    <h2>🎥 Latest Videos</h2>

    <iframe width="300" height="170"
    src="https://www.youtube.com/embed/dQw4w9WgXcQ"></iframe>

    <iframe width="300" height="170"
    src="https://www.youtube.com/embed/dQw4w9WgXcQ"></iframe>
</section>

<section class="section" id="about">
    <h2>👑 About Me</h2>
    <p>I am Jins - Gaming Creator from Kerala 🔥</p>
</section>

<footer>
    <p>© 2026 Jins Gaming Pro</p>
</footer>

<!-- 🔥 JS FOR SLIDER -->
<script>
let index = 0;
function showSlide(){
    const slides = document.getElementById("slide");
    slides.style.transform = "translateX(" + (-index * 100) + "%)";
}
function nextSlide(){
    index = (index + 1) % 3;
    showSlide();
}
function prevSlide(){
    index = (index - 1 + 3) % 3;
    showSlide();
}
</script>

</body>
</html>
