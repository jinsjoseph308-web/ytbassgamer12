<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Jins Gaming Pro</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;600&display=swap" rel="stylesheet">

<style>
*{margin:0;padding:0;box-sizing:border-box;}

body{
    font-family:'Poppins',sans-serif;
    background:radial-gradient(circle,#0a0a0a,#000);
    color:white;
    margin-left:200px;
}

/* 🔥 SIDEBAR */
nav{
    position:fixed;
    left:0;
    top:0;
    width:200px;
    height:100vh;
    background:#000;
    padding:20px;
    display:flex;
    flex-direction:column;
}
nav h2{
    color:#00ffff;
    margin-bottom:30px;
}
nav a{
    color:white;
    text-decoration:none;
    margin:10px 0;
    font-size:18px;
}
nav a:hover{
    color:#00ffff;
    text-shadow:0 0 10px #00ffff;
}
nav a.active{
    color:#00ffff;
    font-weight:bold;
}

/* HERO */
.hero{
    height:90vh;
    display:flex;
    flex-direction:column;
    justify-content:center;
    align-items:center;
    text-align:center;
}
.hero h1{
    font-size:50px;
    color:#00ffff;
}
.hero button{
    margin-top:20px;
    padding:12px 25px;
    background:red;
    border:none;
    color:white;
    cursor:pointer;
    box-shadow:0 0 15px red;
}

/* 🔥 SLIDER */
.slider{
    position:relative;
    overflow:hidden;
}
.slides{
    display:flex;
    transition:0.5s;
}
.slides img{
    width:100%;
    height:300px;
    object-fit:cover;
}

/* buttons */
.prev, .next{
    position:absolute;
    top:50%;
    transform:translateY(-50%);
    background:rgba(0,0,0,0.6);
    color:white;
    border:none;
    padding:10px;
    cursor:pointer;
}
.prev{left:10px;}
.next{right:10px;}

/* SECTION */
.section{
    padding:50px;
    text-align:center;
}
.cards{
    display:flex;
    flex-wrap:wrap;
    justify-content:center;
}
.card{
    background:#111;
    margin:15px;
    padding:20px;
    width:250px;
    border-radius:10px;
    transition:0.3s;
}
.card:hover{
    transform:scale(1.05);
    box-shadow:0 0 15px #00ffff;
}

/* VIDEOS */
iframe{
    border:none;
    border-radius:10px;
    margin:10px;
}

/* FOOTER */
footer{
    padding:20px;
    text-align:center;
    background:#000;
}

/* smooth scroll */
html{
    scroll-behavior:smooth;
}
</style>
</head>

<body>

<!-- 🔥 SIDEBAR -->
<nav>
    <h2>🎮 Jins Gaming</h2>
    <a href="#" class="active">🏠 Home</a>
    <a href="#videos">🎥 Videos</a>
    <a href="#about">👑 About</a>
</nav>

<!-- HERO -->
<section class="hero">
    <h1>🔥 Jins Gaming Pro 🔥</h1>
    <p>Gameplay | Funny | Live 🔴</p>
    <button onclick="window.open('https://youtube.com')">🔴 Subscribe Now</button>
</section>

<!-- 🔥 SLIDER -->
<section class="slider">
    <div class="slides" id="slide">
        <img src="https://picsum.photos/1200/300?1">
        <img src="https://picsum.photos/1200/300?2">
        <img src="https://picsum.photos/1200/300?3">
    </div>
    <button class="prev" onclick="prevSlide()">❮</button>
    <button class="next" onclick="nextSlide()">❯</button>
</section>

<!-- CONTENT -->
<section class="section">
    <h2>⚡ Game Content</h2>
    <div class="cards">
        <div class="card">🎯 BGMI Tips</div>
        <div class="card">😂 Funny Moments</div>
        <div class="card">🔥 Pro Gameplay</div>
    </div>
</section>

<!-- VIDEOS -->
<section class="section" id="videos">
    <h2>🎥 Latest Videos</h2>

    <iframe width="300" height="170"
    src="https://www.youtube.com/embed/dQw4w9WgXcQ"></iframe>

    <iframe width="300" height="170"
    src="https://www.youtube.com/embed/dQw4w9WgXcQ"></iframe>
</section>

<!-- ABOUT -->
<section class="section" id="about">
    <h2>👑 About Me</h2>
    <p>I am Jins - Gaming Creator 🔥</p>
</section>

<!-- FOOTER -->
<footer>
    <p>© 2026 Jins Gaming Pro</p>
</footer>

<!-- 🔥 JS -->
<script>
let index = 0;
const total = 3;

/* auto slide */
let autoSlide = setInterval(nextSlide,3000);

function showSlide(){
    const slides = document.getElementById("slide");
    slides.style.transform = "translateX(" + (-index * 100) + "%)";
}

function nextSlide(){
    index = (index + 1) % total;
    showSlide();
}

function prevSlide(){
    index = (index - 1 + total) % total;
    showSlide();
}

/* pause on hover */
const slider = document.querySelector(".slider");
slider.addEventListener("mouseover", ()=>clearInterval(autoSlide));
slider.addEventListener("mouseout", ()=>autoSlide = setInterval(nextSlide,3000));

/* active menu */
const links = document.querySelectorAll("nav a");
links.forEach(link=>{
    link.addEventListener("click", function(){
        links.forEach(l=>l.classList.remove("active"));
        this.classList.add("active");
    });
});
</script>

</body>
</html>
